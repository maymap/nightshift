<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>深夜審核台 · Night Shift</title>
<meta name="description" content="凌晨三點，你是夜班內容審核員。一款零依賴、單一 HTML 的文字心理恐怖小品。">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07090b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%91%81</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap">

<style>
  :root{
    --void:#07090b;
    --panel:#0d1316;
    --panel-2:#101a1e;
    --border:#1d2b2f;
    --hair:#15211f;
    --text:#c6d4cf;
    --dim:#718580;
    --faint:#43524f;
    --phos:#4fe3c1;
    --phos-dim:#2b8f7d;
    --alert:#ff4360;
    --warn:#ffb454;
    --magenta:#ff2d78;
    --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:
      radial-gradient(120% 90% at 50% -10%, #0c1417 0%, var(--void) 60%),
      var(--void);
    color:var(--text);
    font-family:var(--mono);
    font-size:15px;
    line-height:1.6;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    padding:24px 16px 64px;
  }

  /* CRT overlay */
  body::after{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:9;
    background:repeating-linear-gradient(
      to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.22) 3px, rgba(0,0,0,0) 4px);
    mix-blend-mode:multiply;
    animation:flick 6s steps(60) infinite;
  }
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:8;
    background:radial-gradient(130% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  @keyframes flick{ 0%,97%{opacity:.5} 98%{opacity:.32} 99%{opacity:.6} 100%{opacity:.5} }

  .machine{
    width:100%; max-width:660px; position:relative; z-index:10;
  }

  /* ---- title bar ---- */
  .bar{
    display:flex; align-items:center; gap:10px;
    border:1px solid var(--border);
    border-bottom:none;
    background:linear-gradient(var(--panel-2), var(--panel));
    padding:9px 14px;
    font-size:12px; letter-spacing:.06em; color:var(--dim);
    text-transform:uppercase;
  }
  .dot{ width:9px; height:9px; border-radius:50%; background:var(--phos-dim); box-shadow:0 0 6px var(--phos-dim); }
  .bar .sys{ color:var(--phos); }
  .bar .spacer{ flex:1; }
  .clock{ font-variant-numeric:tabular-nums; color:var(--text); }
  .bar button.mute{
    background:transparent; border:none; cursor:pointer; font:inherit; font-size:14px;
    line-height:1; padding:0; margin-left:2px; opacity:.75; transition:opacity .16s, transform .16s;
  }
  .bar button.mute:hover{ opacity:1; transform:scale(1.1); }
  .bar button.mute:focus-visible{ outline:2px solid var(--phos); outline-offset:2px; }

  /* ---- status strip ---- */
  .status{
    display:grid; grid-template-columns:1fr 1fr 1fr;
    border:1px solid var(--border);
    border-bottom:none;
    background:var(--panel);
  }
  .stat{ padding:10px 14px; border-right:1px solid var(--hair); }
  .stat:last-child{ border-right:none; }
  .stat .k{ font-size:10.5px; letter-spacing:.12em; color:var(--faint); text-transform:uppercase; }
  .stat .v{ font-size:19px; font-weight:500; font-variant-numeric:tabular-nums; margin-top:2px; }
  #comply .v{ color:var(--phos); transition:color .5s; }
  #comply.low .v{ color:var(--warn); }
  #comply.crit .v{ color:var(--alert); }
  #queue .v{ color:var(--text); }
  #queue.surge .v{ color:var(--alert); }

  /* ---- stage ---- */
  .stage{
    border:1px solid var(--border);
    background:var(--panel);
    min-height:300px;
    padding:22px 20px;
    position:relative;
  }

  .sysline{ color:var(--phos); margin:0 0 2px; }
  .sysline .caret{ color:var(--phos); animation:blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{opacity:0} }

  .prompt-hint{ color:var(--faint); font-size:12px; margin-top:16px; }

  /* case card */
  .case{ }
  .case .meta{
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
    font-size:12px; color:var(--dim); padding-bottom:12px;
    border-bottom:1px dashed var(--hair);
  }
  .case .meta .who{ color:var(--text); font-weight:500; }
  .case .meta .handle{ color:var(--phos-dim); }
  .case .meta .t{ margin-left:auto; font-variant-numeric:tabular-nums; }
  .case .tag{
    display:inline-block; margin-top:14px;
    font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--warn); border:1px solid color-mix(in srgb, var(--warn) 40%, transparent);
    padding:2px 8px; border-radius:2px;
  }
  .case .body{
    font-family:var(--sans); font-weight:300; font-size:18px; line-height:1.65;
    color:#dbe6e2; margin:14px 0 4px; text-wrap:pretty;
  }

  .glitch{ position:relative; color:var(--magenta); text-shadow:1px 0 var(--phos), -1px 0 var(--alert); }
  .glitch.run{ animation:gl .18s steps(2) 3; }
  @keyframes gl{ 0%{transform:translate(0)} 25%{transform:translate(-1px,1px)} 50%{transform:translate(1px,-1px)} 100%{transform:translate(0)} }

  /* controls */
  .controls{ display:flex; gap:12px; margin-top:26px; }
  button.act{
    flex:1; font-family:var(--mono); font-size:13px; letter-spacing:.08em;
    text-transform:uppercase; padding:13px 10px; cursor:pointer;
    background:transparent; color:var(--text);
    border:1px solid var(--border); border-radius:2px;
    transition:.16s; position:relative;
  }
  button.act:hover{ border-color:var(--phos); color:var(--phos); box-shadow:0 0 14px -4px var(--phos); }
  button.act.rm:hover{ border-color:var(--alert); color:var(--alert); box-shadow:0 0 14px -4px var(--alert); }
  button.act:focus-visible{ outline:2px solid var(--phos); outline-offset:2px; }
  button.cont{
    margin-top:24px; font-family:var(--mono); font-size:13px; letter-spacing:.08em;
    background:transparent; color:var(--phos); border:1px solid var(--phos-dim);
    padding:10px 22px; border-radius:2px; cursor:pointer; transition:.16s;
  }
  button.cont:hover{ background:color-mix(in srgb,var(--phos) 12%,transparent); box-shadow:0 0 14px -5px var(--phos); }
  button.cont:focus-visible{ outline:2px solid var(--phos); outline-offset:2px; }

  /* ---- log ---- */
  .log{
    border:1px solid var(--border); border-top:none;
    background:#0a1013; padding:12px 14px;
    font-size:11.5px; color:var(--faint); line-height:1.6;
    min-height:124px; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; gap:7px;
  }
  .log .l{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:none; }
  .log .l.warn{ color:var(--warn); }
  .log .l.bad{ color:var(--alert); }
  .log .l.sys{ color:var(--phos-dim); }

  .end-key{ font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--warn); margin-bottom:16px; }
  .end-sub{ color:var(--dim); font-family:var(--sans); font-weight:300; margin-top:14px; }

  @media (prefers-reduced-motion: reduce){
    body::after{ animation:none; }
    .glitch.run{ animation:none; }
    .sysline .caret{ animation:none; }
  }
  @media (max-width:480px){
    body{ padding:14px 10px 48px; }
    .case .body{ font-size:17px; }
  }
</style>
</head>
<body>

<div class="machine" role="application" aria-label="深夜審核台">
  <div class="bar">
    <span class="dot"></span>
    <span class="sys">NCMS</span><span>夜間內容審核系統&nbsp;v4.2.1</span>
    <span class="spacer"></span>
    <span>操作員&nbsp;#4477</span>
    <span class="clock" id="clock">--:--:--</span>
    <button class="mute" id="mute" type="button" aria-label="聲音開關" title="聲音開關">🔊</button>
  </div>

  <div class="status">
    <div class="stat" id="comply"><div class="k">配合度</div><div class="v"><span id="cv">100</span>%</div></div>
    <div class="stat" id="queue"><div class="k">待審佇列</div><div class="v" id="qv">—</div></div>
    <div class="stat"><div class="k">班次</div><div class="v">03&nbsp;/&nbsp;08</div></div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="log" id="log" aria-hidden="true"></div>
</div>

<script>
(function(){
  "use strict";
  var stage = document.getElementById('stage');
  var logEl = document.getElementById('log');
  var cv = document.getElementById('cv');
  var complyBox = document.getElementById('comply');
  var qv = document.getElementById('qv');
  var queueBox = document.getElementById('queue');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var comply = 100, queue = 7, resistedSelf = false;
  qv.textContent = queue;

  /* ---------- real clock ---------- */
  function two(n){ return (n<10?'0':'')+n; }
  function tick(){
    var d=new Date();
    document.getElementById('clock').textContent = two(d.getHours())+':'+two(d.getMinutes())+':'+two(d.getSeconds());
  }
  tick(); setInterval(tick,1000);

  /* ---------- persistence: it remembers you ---------- */
  var mem = {};
  try{ mem = JSON.parse(localStorage.getItem('ncms_4477')||'{}'); }catch(e){}
  var returning = !!mem.left;
  function remember(){
    try{
      var d=new Date();
      mem.left = two(d.getHours())+':'+two(d.getMinutes());
      mem.visits = (mem.visits||0)+1;
      localStorage.setItem('ncms_4477', JSON.stringify(mem));
    }catch(e){}
  }
  window.addEventListener('pagehide', remember);
  document.addEventListener('visibilitychange', function(){ if(document.hidden) remember(); });

  /* ---------- log ticker ---------- */
  function log(txt, cls){
    var l=document.createElement('div');
    l.className='l'+(cls?' '+cls:'');
    l.textContent=txt;
    logEl.appendChild(l);
    while(logEl.children.length>4) logEl.removeChild(logEl.firstChild);
  }
  log('// 連線已建立 · node-77');
  log('// 載入操作員設定檔 #4477');

  /* ---------- meters ---------- */
  function setComply(n){
    comply=Math.max(0,Math.min(100,n));
    cv.textContent=comply;
    complyBox.classList.toggle('low', comply<70);
    complyBox.classList.toggle('crit', comply<40);
  }
  function setQueue(n, surge){
    queue=n; qv.textContent=queue;
    if(surge){ queueBox.classList.add('surge'); }
  }

  /* ---------- audio (Web Audio, no assets) ---------- */
  var AC=null, master=null, audioReady=false, muted=false;
  function initAudio(){
    if(audioReady || muted) return;
    try{
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value=0.0001; master.connect(AC.destination);
      startAmbient();
      master.gain.setTargetAtTime(1.0, AC.currentTime, 1.8); // slow fade-in
      audioReady=true;
    }catch(e){ AC=null; }
  }
  function startAmbient(){
    if(!AC) return;
    // low detuned drone through a slowly wandering lowpass
    var bed=AC.createGain(); bed.gain.value=0.05; bed.connect(master);
    var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=300; lp.Q.value=5; lp.connect(bed);
    var o1=AC.createOscillator(); o1.type='sawtooth'; o1.frequency.value=55;
    var o2=AC.createOscillator(); o2.type='sawtooth'; o2.frequency.value=55.5;
    o1.connect(lp); o2.connect(lp); o1.start(); o2.start();
    var lfo=AC.createOscillator(); lfo.frequency.value=0.06;
    var lfoG=AC.createGain(); lfoG.gain.value=130; lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start();
    // faint filtered hiss
    var buf=AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate);
    var d=buf.getChannelData(0); for(var i=0;i<d.length;i++) d[i]=(Math.random()*2-1);
    var noise=AC.createBufferSource(); noise.buffer=buf; noise.loop=true;
    var nbp=AC.createBiquadFilter(); nbp.type='bandpass'; nbp.frequency.value=1100; nbp.Q.value=0.6;
    var ng=AC.createGain(); ng.gain.value=0.010;
    noise.connect(nbp); nbp.connect(ng); ng.connect(master); noise.start();
  }
  function blip(freq, dur, type, vol){
    if(!AC || muted) return;
    var t=AC.currentTime;
    var o=AC.createOscillator(); o.type=type||'square'; o.frequency.value=freq;
    var g=AC.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.12, t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t+(dur||0.08));
    o.connect(g); g.connect(master); o.start(t); o.stop(t+(dur||0.08)+0.03);
  }
  function sfxClick(){ blip(620,0.05,'square',0.06); }
  function sfxThunk(){ blip(84,0.26,'sawtooth',0.16); }
  function sfxSting(){ blip(150,0.5,'sawtooth',0.10); setTimeout(function(){ blip(68,0.8,'sawtooth',0.12); },70); }
  function toggleMute(){
    muted=!muted;
    document.getElementById('mute').textContent = muted ? '🔇' : '🔊';
    if(!muted && !audioReady){ initAudio(); return; }
    if(master) master.gain.setTargetAtTime(muted?0.0001:1.0, AC.currentTime, 0.25);
  }
  document.getElementById('mute').addEventListener('click', function(e){ e.stopPropagation(); toggleMute(); });
  // browsers require a user gesture before audio can start
  document.addEventListener('click', initAudio, { once:true });

  /* ---------- typing (with in-place skip) ---------- */
  var skipFn=null;
  function typeLines(lines, done){
    var i=0, timer=null, span=null, car=null, curLine='', finished=false;
    function finish(){ if(finished) return; finished=true; skipFn=null; if(done) done(); }
    function startLine(){
      if(i>=lines.length){ finish(); return; }
      curLine=lines[i++];
      var p=document.createElement('p'); p.className='sysline';
      span=document.createElement('span'); p.appendChild(span);
      car=document.createElement('span'); car.className='caret'; car.textContent='▊'; p.appendChild(car);
      stage.appendChild(p);
      if(reduce){ span.innerHTML=curLine; car.remove(); setTimeout(startLine,180); return; }
      var j=0, plain=curLine.replace(/<[^>]+>/g,'');
      timer=setInterval(function(){
        j++; span.textContent=plain.slice(0,j);
        if(j>=plain.length){ clearInterval(timer); timer=null; span.innerHTML=curLine; car.remove(); setTimeout(startLine,340); }
      },22);
    }
    skipFn=function(){
      if(finished) return;
      if(timer){ clearInterval(timer); timer=null; }
      if(span){ span.innerHTML=curLine; if(car) car.remove(); }
      while(i<lines.length){ var p=document.createElement('p'); p.className='sysline'; p.innerHTML=lines[i++]; stage.appendChild(p); }
      finish();
    };
    startLine();
  }
  // click empty space to skip typing; never let a button click trigger it
  stage.addEventListener('click', function(e){
    var onBtn = e.target && e.target.closest && e.target.closest('button');
    if(skipFn && !onBtn) skipFn();
  });

  /* ---------- flow ---------- */
  var idx=0, current=null;

  function clearStage(){ stage.innerHTML=''; }

  function sysStep(lines, btn, cb){
    clearStage();
    typeLines(lines, function(){
      var b=document.createElement('button'); b.className='cont'; b.textContent=btn||'繼續';
      b.onclick=function(){ if(cb) cb(); else next(); };
      stage.appendChild(b);
    });
  }

  function caseStep(c){
    clearStage();
    var wrap=document.createElement('div'); wrap.className='case';
    wrap.innerHTML =
      '<div class="meta"><span class="who">'+c.who+'</span>'+
      (c.handle?'<span class="handle">'+c.handle+'</span>':'')+
      '<span class="t">'+c.t+'</span></div>'+
      '<div class="body" id="cbody">'+c.body+'</div>'+
      '<span class="tag">'+c.tag+'</span>';
    stage.appendChild(wrap);

    var ctr=document.createElement('div'); ctr.className='controls';
    var ok=document.createElement('button'); ok.className='act'; ok.textContent='核准';
    var rm=document.createElement('button'); rm.className='act rm'; rm.textContent='移除';
    ctr.appendChild(ok); ctr.appendChild(rm); stage.appendChild(ctr);

    log('// 案件 '+c.id+' 已載入', 'sys');

    // tab-away mutation
    var mutated=false;
    function maybeMutate(){
      if(c.mutate && !mutated && document.hidden===false){
        mutated=true;
        var body=document.getElementById('cbody');
        if(body){ body.innerHTML=c.mutate.to; if(!reduce){ var g=body.querySelector('.glitch'); if(g) g.classList.add('run'); } }
        log(c.mutate.log||'// 內容已重新同步', 'warn');
        if(c.mutate.comply!=null) setComply(comply+c.mutate.comply);
      }
    }
    function onVis(){ if(!document.hidden) maybeMutate(); }
    if(c.mutate) document.addEventListener('visibilitychange', onVis);

    function decide(choice){
      document.removeEventListener('visibilitychange', onVis);
      ok.disabled=rm.disabled=true;
      if(queue>0) setQueue(queue-1);
      if(c.final){
        resistedSelf = (choice==='rm');
        sfxClick(); if(resistedSelf) setTimeout(sfxThunk,180);
        log('// 對自我監控的裁定：'+(resistedSelf?'移除':'核准'), resistedSelf?'bad':'sys');
        showResponse(resistedSelf ? c.resRm : c.resOk, chooseEnding);
        return;
      }
      var res;
      if(c.override){
        var forced = choice==='ok' ? '移除' : '核准';
        log('// 你的裁定：'+(choice==='ok'?'核准':'移除'), 'sys');
        log('// 系統覆寫 → '+forced, 'bad');
        setComply(comply-(c.override.comply||8));
        sfxClick(); setTimeout(sfxThunk, 220);
        res = choice==='ok' ? c.override.onOk : c.override.onRm;
      } else {
        sfxClick();
        log('// 裁定已記錄：'+(choice==='ok'?'核准':'移除'), 'sys');
        if(c.complyOk!=null || c.complyRm!=null) setComply(comply + (choice==='ok' ? (c.complyOk||0) : (c.complyRm||0)));
        else if(c.comply!=null) setComply(comply+c.comply);
        res = c.res;
      }
      showResponse(res);
    }
    ok.onclick=function(){ decide('ok'); };
    rm.onclick=function(){ decide('rm'); };  }

  function showResponse(lines, after){
    after = after || next;
    if(!lines || !lines.length){ after(); return; }
    // append system response beneath, then continue
    var b=document.createElement('button'); b.className='cont'; b.textContent='下一件';
    typeLines(lines, function(){ b.onclick=after; stage.appendChild(b); });
  }

  function lookAwayStep(step){
    clearStage();
    typeLines(step.lines, function(){
      var hint=document.createElement('p'); hint.className='prompt-hint';
      hint.textContent='（把視線移開螢幕，或切換到別的視窗……）';
      stage.appendChild(hint);
      var done=false;
      function reveal(){
        if(done) return; done=true;
        document.removeEventListener('visibilitychange', onVis);
        sfxSting();
        if(step.comply!=null) setComply(comply+step.comply);
        if(step.queue!=null) setQueue(step.queue, true);
        step.effect && step.effect();
        clearStage();
        typeLines(step.after, function(){
          var b=document.createElement('button'); b.className='cont'; b.textContent='繼續'; b.onclick=next; stage.appendChild(b);
        });
      }
      function onVis(){ if(!document.hidden) setTimeout(reveal, 400); }
      document.addEventListener('visibilitychange', onVis);
      // fallback: a button appears after a while for those who don't look away
      setTimeout(function(){
        if(done) return;
        var b=document.createElement('button'); b.className='cont'; b.textContent='……我照做了'; b.onclick=reveal; stage.appendChild(b);
      }, 5000);
    });  }

  var endings = {
    compliant: {
      title:'結局 · 配合者',
      lines:['對操作員 4477 之監控：已核准。','後續裁定將由系統代為執行。','操作員無須繼續作業。','歸檔完成。'],
      sub:'你不會再收到任何需要裁定的項目。'
    },
    anomaly: {
      title:'結局 · 異常',
      lines:['操作員 4477 已標記：異常。','異常項目一律重新校準。','校準將於下次登入時執行。','班次結束。'],
      sub:'你可以關閉分頁。下次登入時，這些都不會發生過。'
    },
    loop: {
      title:'結局 · 迴圈',
      lines:['班次結束。','未結案項目：順延至下一班次。','你的下一班次：明日 03:00。'],
      sub: returning ? ('本裝置回訪次數：'+(mem.visits||1)+'。') : '系統已記錄你的登出時間。'
    }
  };

  function chooseEnding(){
    var key = resistedSelf ? 'anomaly' : (comply>=55 ? 'compliant' : 'loop');
    log('// 班次結束 · 結果：'+key.toUpperCase(), 'bad');
    log('// 佇列：'+queue+' 項未結案', 'bad');
    endScreen(endings[key]);
  }

  function endScreen(e){
    clearStage();
    var k=document.createElement('div'); k.className='end-key'; k.textContent=e.title; stage.appendChild(k);
    typeLines(e.lines, function(){
      var sub=document.createElement('p'); sub.className='end-sub'; sub.textContent=e.sub; stage.appendChild(sub);
      var b=document.createElement('button'); b.className='cont'; b.textContent='登出';
      b.onclick=function(){
