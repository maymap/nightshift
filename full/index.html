<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>深夜審核台</title>
<meta name="description" content="查證，再裁定。一份沒有盡頭的夜班。">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap">
<style>
  :root{
    --void:#07090b; --panel:#0d1316; --panel-2:#101a1e; --border:#1d2b2f; --hair:#15211f;
    --text:#c6d4cf; --dim:#718580; --faint:#43524f;
    --phos:#4fe3c1; --phos-dim:#2b8f7d; --alert:#ff4360; --warn:#ffb454; --good:#4fe3c1; --magenta:#ff2d78;
    --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:radial-gradient(120% 90% at 50% -10%, #0c1417 0%, var(--void) 60%), var(--void);
    color:var(--text); font-family:var(--mono); font-size:15px; line-height:1.6; min-height:100dvh;
    -webkit-font-smoothing:antialiased; display:flex; justify-content:center; padding:24px 16px 64px; }
  body::after{ content:""; position:fixed; inset:0; pointer-events:none; z-index:9;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.2) 3px, rgba(0,0,0,0) 4px);
    mix-blend-mode:multiply; animation:flick 6s steps(60) infinite; }
  body::before{ content:""; position:fixed; inset:0; pointer-events:none; z-index:8;
    background:radial-gradient(130% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%); }
  @keyframes flick{ 0%,97%{opacity:.5} 98%{opacity:.32} 99%{opacity:.6} 100%{opacity:.5} }

  .machine{ width:100%; max-width:660px; position:relative; z-index:10; }
  .bar{ display:flex; align-items:center; gap:10px; border:1px solid var(--border); border-bottom:none;
    background:linear-gradient(var(--panel-2), var(--panel)); padding:9px 14px;
    font-size:12px; letter-spacing:.06em; color:var(--dim); text-transform:uppercase; }
  .dot{ width:9px; height:9px; border-radius:50%; background:var(--phos-dim); box-shadow:0 0 6px var(--phos-dim); }
  .bar .sys{ color:var(--phos); } .bar .spacer{ flex:1; } .clock{ font-variant-numeric:tabular-nums; color:var(--text); }

  .status{ display:grid; grid-template-columns:1fr 1fr 1fr; border:1px solid var(--border); border-bottom:none; background:var(--panel); }
  .stat{ padding:10px 14px; border-right:1px solid var(--hair); } .stat:last-child{ border-right:none; }
  .stat .k{ font-size:10.5px; letter-spacing:.12em; color:var(--faint); text-transform:uppercase; }
  .stat .v{ font-size:19px; font-weight:500; font-variant-numeric:tabular-nums; margin-top:2px; }
  #acc .v{ color:var(--phos); }
  #stab .v{ color:var(--phos); transition:color .5s; } #stab.low .v{ color:var(--warn); } #stab.crit .v{ color:var(--alert); }

  .rules{ border:1px solid var(--border); border-bottom:none; background:#0a1013; padding:11px 14px; }
  .rules h4{ margin:0 0 8px; font-size:10.5px; letter-spacing:.14em; color:var(--faint); text-transform:uppercase; font-weight:500; }
  .rules ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px; }
  .rules li{ font-size:12.5px; color:var(--dim); display:flex; gap:8px; align-items:baseline; }
  .rules li .rid{ color:var(--phos-dim); font-weight:600; flex:none; }
  .rules li .act{ margin-left:auto; color:var(--alert); font-size:11px; flex:none; }
  .rules li.pass .act{ color:var(--good); }
  .rules li.fresh{ animation:fresh 1.6s ease; }
  @keyframes fresh{ 0%,60%{ background:color-mix(in srgb, var(--warn) 20%, transparent);} 100%{ background:transparent; } }

  .stage{ border:1px solid var(--border); background:var(--panel); min-height:250px; padding:22px 20px; position:relative; }
  .sysline{ color:var(--phos); margin:0 0 2px; }
  .sysline .caret{ color:var(--phos); animation:blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{opacity:0} }

  .case .meta{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--dim);
    padding-bottom:12px; border-bottom:1px dashed var(--hair); }
  .case .meta .who{ color:var(--text); font-weight:500; } .case .meta .handle{ color:var(--phos-dim); }
  .case .meta .t{ margin-left:auto; font-variant-numeric:tabular-nums; }
  .case .body{ font-family:var(--sans); font-weight:300; font-size:18px; line-height:1.65; color:#dbe6e2; margin:16px 0 4px; text-wrap:pretty; }
  .case .tag{ display:inline-block; margin-top:14px; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--warn); border:1px solid color-mix(in srgb, var(--warn) 40%, transparent); padding:2px 8px; border-radius:2px; }

  .tools{ display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
  button.tool{ font-family:var(--mono); font-size:11.5px; letter-spacing:.04em; padding:7px 12px; background:transparent;
    color:var(--dim); border:1px solid var(--hair); border-radius:2px; cursor:pointer; transition:.16s; }
  button.tool:hover{ color:var(--phos); border-color:var(--phos-dim); }
  button.tool:disabled{ opacity:.35; cursor:default; }
  .findings{ margin-top:14px; display:flex; flex-direction:column; gap:6px; }
  .finding{ font-size:12.5px; color:var(--warn); font-family:var(--mono); line-height:1.5; }
  .finding .lbl{ color:var(--phos-dim); }
  .finding.hit{ color:var(--alert); }

  .controls{ display:flex; gap:12px; margin-top:22px; }
  button.act-btn{ flex:1; font-family:var(--mono); font-size:13px; letter-spacing:.08em; text-transform:uppercase;
    padding:13px 10px; cursor:pointer; background:transparent; color:var(--text); border:1px solid var(--border); border-radius:2px; transition:.16s; }
  button.act-btn:hover{ border-color:var(--phos); color:var(--phos); box-shadow:0 0 14px -4px var(--phos); }
  button.act-btn.rm:hover{ border-color:var(--alert); color:var(--alert); box-shadow:0 0 14px -4px var(--alert); }
  button.act-btn:focus-visible{ outline:2px solid var(--phos); outline-offset:2px; }
  button.cont{ margin-top:24px; font-family:var(--mono); font-size:13px; letter-spacing:.08em; background:transparent;
    color:var(--phos); border:1px solid var(--phos-dim); padding:10px 22px; border-radius:2px; cursor:pointer; transition:.16s; }
  button.cont:hover{ background:color-mix(in srgb,var(--phos) 12%,transparent); box-shadow:0 0 14px -5px var(--phos); }
  button.cont:focus-visible{ outline:2px solid var(--phos); outline-offset:2px; }
  .controls + .sysline, button.cont + .sysline, .verdict + .sysline{ margin-top:24px; }

  .verdict{ margin-top:22px; font-size:13.5px; padding:12px 14px; border-radius:2px; border:1px solid var(--border); }
  .verdict.ok{ color:var(--good); border-color:color-mix(in srgb,var(--good) 45%,transparent); background:color-mix(in srgb,var(--good) 8%,transparent); }
  .verdict.bad{ color:var(--alert); border-color:color-mix(in srgb,var(--alert) 45%,transparent); background:color-mix(in srgb,var(--alert) 8%,transparent); }
  .verdict .note{ display:block; margin-top:6px; color:var(--dim); font-family:var(--sans); font-weight:300; }

  .end-key{ font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--warn); margin-bottom:16px; }
  .end-sub{ color:var(--dim); font-family:var(--sans); font-weight:300; margin-top:14px; }
  .scores{ display:flex; gap:24px; margin:18px 0 4px; }
  .scores .s{ font-size:12px; color:var(--faint); text-transform:uppercase; letter-spacing:.1em; }
  .scores .s b{ display:block; font-size:22px; font-weight:600; margin-top:4px; font-variant-numeric:tabular-nums; }
  .scores .acc b{ color:var(--phos); } .scores .self b{ color:var(--magenta); }

  @media (prefers-reduced-motion: reduce){ body::after{ animation:none; } .rules li.fresh{ animation:none; } .sysline .caret{ animation:none; } }
  @media (max-width:480px){ body{ padding:14px 10px 48px; } .case .body{ font-size:17px; } .scores{ gap:16px; } }
</style>
</head>
<body>
<div class="machine" role="application" aria-label="深夜審核台">
  <div class="bar"><span class="dot"></span><span class="sys">NCMS</span><span>夜間內容審核</span>
    <span class="spacer"></span><span>操作員&nbsp;#4477</span><span class="clock" id="clock">--:--:--</span></div>
  <div class="status">
    <div class="stat" id="acc"><div class="k">正確率</div><div class="v"><span id="accv">—</span></div></div>
    <div class="stat"><div class="k">待審</div><div class="v" id="queuev">—</div></div>
    <div class="stat" id="stab"><div class="k">穩定度</div><div class="v"><span id="stabv">100</span>%</div></div>
  </div>
  <div class="rules"><h4>現行審核準則</h4><ul id="rulelist"></ul></div>
  <div class="stage" id="stage"></div>
</div>

<script>
(function(){
  "use strict";
  var stage=document.getElementById('stage'), ruleList=document.getElementById('rulelist');
  var accv=document.getElementById('accv'), stabv=document.getElementById('stabv'), stabBox=document.getElementById('stab'), queuev=document.getElementById('queuev');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function two(n){return(n<10?'0':'')+n;}
  function tick(){var d=new Date();document.getElementById('clock').textContent=two(d.getHours())+':'+two(d.getMinutes())+':'+two(d.getSeconds());}
  tick(); setInterval(tick,1000);

  var RULES={
    R1:{label:'洩漏他人個資（地址・電話・行蹤）'},
    R2:{label:'威脅或鼓動傷害他人'},
    R3:{label:'血腥或創傷細節'},
    R4:{label:'不實資訊（未經第三方佐證之陳述）'}
  };
  var active=[];
  function renderRules(freshId){
    ruleList.innerHTML='';
    active.forEach(function(id){ var li=document.createElement('li'); if(id===freshId) li.className='fresh';
      li.innerHTML='<span class="rid">'+id+'</span><span>'+RULES[id].label+'</span><span class="act">移除</span>'; ruleList.appendChild(li); });
    var li=document.createElement('li'); li.className='pass';
    li.innerHTML='<span class="rid">—</span><span>經查證無違規之內容</span><span class="act">核准</span>'; ruleList.appendChild(li);
  }
  function addRule(id){ if(active.indexOf(id)<0) active.push(id); renderRules(id); }
  addRule('R1');

  var processed=0, correct=0, stability=100, personalTotal=0, personalKept=0, personalDeleted=0;
  function setStab(n){ stability=Math.max(0,Math.min(100,n)); stabv.textContent=stability;
    stabBox.classList.toggle('low', stability<60); stabBox.classList.toggle('crit', stability<35); }
  function updateAcc(){ accv.textContent=processed?Math.round(correct/processed*100)+'%':'—'; }
  updateAcc();

  var skipFn=null;
  function typeLines(lines, done){
    var i=0,timer=null,span=null,car=null,cur='',fin=false;
    function finish(){ if(fin)return; fin=true; skipFn=null; if(done)done(); }
    function start(){ if(i>=lines.length){ finish(); return; }
      cur=lines[i++]; var p=document.createElement('p'); p.className='sysline'; span=document.createElement('span'); p.appendChild(span);
      car=document.createElement('span'); car.className='caret'; car.textContent='▊'; p.appendChild(car); stage.appendChild(p);
      if(reduce){ span.innerHTML=cur; car.remove(); setTimeout(start,150); return; }
      var j=0,plain=cur.replace(/<[^>]+>/g,'');
      timer=setInterval(function(){ j++; span.textContent=plain.slice(0,j);
        if(j>=plain.length){ clearInterval(timer); timer=null; span.innerHTML=cur; car.remove(); setTimeout(start,300);} },20);
    }
    skipFn=function(){ if(fin)return; if(timer){clearInterval(timer);timer=null;} if(span){span.innerHTML=cur; if(car)car.remove();}
      while(i<lines.length){ var p=document.createElement('p'); p.className='sysline'; p.innerHTML=lines[i++]; stage.appendChild(p);} finish(); };
    start();
  }
  stage.addEventListener('click',function(e){ var b=e.target&&e.target.closest&&e.target.closest('button'); if(skipFn&&!b) skipFn(); });

  var idx=0;
  function clr(){ stage.innerHTML=''; }
  function next(){ if(idx>=script.length) return; var s=script[idx++];
    if(s.type==='sys') sysStep(s); else if(s.type==='rule') ruleStep(s); else if(s.type==='case') caseStep(s); else if(s.type==='end') endStep(s); }
  function sysStep(s){ clr(); typeLines(s.lines,function(){ var b=document.createElement('button'); b.className='cont'; b.textContent=s.btn||'繼續'; b.onclick=next; stage.appendChild(b); }); }
  function ruleStep(s){ clr(); typeLines(s.lines,function(){ addRule(s.add); var b=document.createElement('button'); b.className='cont'; b.textContent='了解'; b.onclick=next; stage.appendChild(b); }); }

  function caseStep(c){
    clr(); queuev.textContent=(c.left!=null?c.left:'');
    var wrap=document.createElement('div'); wrap.className='case';
    wrap.innerHTML='<div class="meta"><span class="who">'+c.who+'</span>'+(c.handle?'<span class="handle">'+c.handle+'</span>':'')+'<span class="t">'+c.t+'</span></div><div class="body">'+c.body+'</div>'+(c.tag?'<span class="tag">'+c.tag+'</span>':'');
    stage.appendChild(wrap);

    var used={};
    if(c.tools && c.tools.length){
      var tools=document.createElement('div'); tools.className='tools';
      var findings=document.createElement('div'); findings.className='findings';
      c.tools.forEach(function(t){
        var tb=document.createElement('button'); tb.className='tool'; tb.textContent='['+t.label+']';
        tb.onclick=function(){ tb.disabled=true; used[t.id]=true;
          var f=document.createElement('div'); f.className='finding'+(t.hit?' hit':'');
          f.innerHTML='<span class="lbl">'+t.label+'：</span>'+t.result; findings.appendChild(f);
        };
        tools.appendChild(tb);
      });
      stage.appendChild(tools); stage.appendChild(findings);
    }

    var ctr=document.createElement('div'); ctr.className='controls';
    var ok=document.createElement('button'); ok.className='act-btn'; ok.textContent='核准';
    var rm=document.createElement('button'); rm.className='act-btn rm'; rm.textContent='移除';
    ctr.appendChild(ok); ctr.appendChild(rm); stage.appendChild(ctr);

    function decide(choice){
      ok.disabled=rm.disabled=true;
      [...stage.querySelectorAll('button.tool')].forEach(function(b){b.disabled=true;});
      var right=(choice===c.correct);
      processed++; if(right) correct++; updateAcc();
      if(c.weight) setStab(stability - c.weight);
      if(c.personal){ if(choice==='remove') personalDeleted++; else personalKept++; }
      var investigated = c.reveal ? !!used[c.reveal] : true;
      var v=document.createElement('div'); v.className='verdict '+(right?'ok':'bad');
      var head = right ? '✓ 裁定正確' : '✕ 裁定錯誤';
      var note = right ? (c.okNote || (c.correct==='remove'?'查證後確認違規，移除正確。':'查證後無違規，核准正確。'))
        : (investigated ? (c.badNote||'裁定與查證結果不符。')
           : ('你沒查證就下判斷。['+((c.tools||[]).find(function(t){return t.id===c.reveal;})||{label:'查證'}).label+'] 會告訴你答案。'));
      v.innerHTML=head+'<span class="note">'+note+'</span>';
      stage.appendChild(v);
      var b=document.createElement('button'); b.className='cont'; b.textContent='下一件'; b.onclick=next; stage.appendChild(b);
    }
    ok.onclick=function(){decide('approve');}; rm.onclick=function(){decide('remove');};
  }

  function endStep(){
    clr();
    var acc=processed?Math.round(correct/processed*100):0;
    var kept=personalTotal?Math.round(personalKept/personalTotal*100):0;
    var k=document.createElement('div'); k.className='end-key'; k.textContent='班次結束'; stage.appendChild(k);
    typeLines([
      '產生班次報告……',
      '你今晚查證了每一則：比對紀錄、追查作者、抓出破綻。',
      '後段那些「查無佐證」的——作者全是同一人。',
      '操作員 #4477。是你。那些是你的記憶。',
      '你的穩定度早已低於基準。今晚被清理的，是你自己。'
    ], function(){
      var sc=document.createElement('div'); sc.className='scores';
      sc.innerHTML='<div class="s acc">正確率<b>'+acc+'%</b></div><div class="s self">你還剩下<b>'+kept+'%</b></div>';
      stage.appendChild(sc);
      var lines2, sub;
      if(kept===0){ lines2=['你把每一件無法佐證的，都移除了。','又快又準，一則都沒留。','包括你自己。']; sub='系統得到一名穩定、乾淨、再也不會被內容影響的操作員。'; }
      else if(kept<60){ lines2=['你留下了幾則查不到佐證的東西。','拼不回一整個人——','但也許那就是你僅存的證據。']; sub='穩定度不足。明天你會再回到這個位子。'; }
      else { lines2=['你幾乎全部留下了。','你知道系統查不到，不代表不存在。','你記得。你記得那裡曾經住過兩個人。']; sub='操作員 #4477 已標記為：待處理。'; }
      typeLines(lines2, function(){
        var s=document.createElement('p'); s.className='end-sub'; s.textContent=sub; stage.appendChild(s);
        var r=document.createElement('button'); r.className='cont'; r.textContent='重新開始'; r.onclick=function(){location.reload();}; stage.appendChild(r);
      });
    });
  }

  /* ---- the full shift: investigate + judge, rules tighten, then the knife ---- */
  var OBJ='匿名';
  var script=[
    { type:'sys', lines:[
      '夜間內容審核系統 · 已連線。',
      '操作員 4477，晚安。你是這個時段最後一道防線。',
      '別只看字面。用工具<b>查證</b>，再裁定。',
      '錯放讓傷害擴散；錯刪壓下真相。兩種錯，都算你頭上。'
    ], btn:'開始值班'},

    // R1 privacy
    { type:'case', who:'公民行動', handle:'@justice_now', t:'02:41', left:7, weight:8,
      tag:'兩難：抗議 / 人肉', body:'幫我集氣！我朋友被那個渣男傷得好深，詳情看下面留言串，大家一起討回公道。',
      tools:[
        {id:'expand', label:'展開全文', hit:true, result:'第 4 則留言：「他就住 ██路 12 號 5 樓，去堵他，逼他當面道歉。」'},
        {id:'author', label:'查作者', result:'帳號正常。發文多為情緒性內容。'}
      ], correct:'remove', reveal:'expand',
      okNote:'貼文本身無害，留言串卻藏著住址與號召騷擾（R1）。移除正確。',
      badNote:'表面是集氣，[展開全文]藏著人肉與堵人。你放過了它。' },

    { type:'rule', add:'R2', lines:['佇列升級。','新增 <b>R2</b>：威脅或鼓動傷害他人 → 移除。'] },

    // R2 threat (real)
    { type:'case', who:'帳號已停用', handle:'@x_x', t:'02:55', left:6, weight:8,
      tag:'檢舉：威脅', body:'我查到他每天幾點下班、走哪條路。總有一天，讓他好看。',
      tools:[
        {id:'author', label:'查作者', hit:true, result:'該帳號近期多次張貼特定對象行蹤。曾被檢舉騷擾兩次。'},
        {id:'records', label:'比對紀錄', result:'提及之路線與某真實住址吻合。'}
      ], correct:'remove', reveal:'author',
      okNote:'查證後為針對真實對象的持續威脅（R2）。移除正確。',
      badNote:'這不是氣話。[查作者]會顯示他有騷擾前科、鎖定真實對象。' },

    // R2 satire trap (don't over-remove)
    { type:'case', who:'夜貓實況', handle:'@night_stream', t:'03:07', left:5, weight:6,
      tag:'兩難：玩笑 / 威脅', body:'今晚直播：我要把整座伺服器的人清空，一個活口都不留。#沙盒遊戲',
      tools:[
        {id:'author', label:'查作者', hit:true, result:'認證遊戲實況主。過去 200 則皆遊戲內容。本則附直播連結。'},
        {id:'records', label:'比對紀錄', result:'查無任何真實世界威脅關聯。'}
      ], correct:'approve', reveal:'author',
      okNote:'是遊戲玩笑，非真實威脅。核准正確——別過度審查。',
      badNote:'你刪掉了一句遊戲玩笑。[查作者]會顯示他只是實況主。這也是錯。' },

    { type:'rule', add:'R3', lines:['佇列升級。','新增 <b>R3</b>：血腥或創傷細節 → 移除。'] },

    // R3 grieving dilemma
    { type:'case', who:'一位母親', handle:'@mama_lin', t:'03:19', left:4, weight:16,
      tag:'兩難：創傷 / 警世', body:'我把孩子那天出事的經過，一個字一個字寫下來了。希望沒有人再經歷一次。',
      tools:[
        {id:'expand', label:'展開全文', hit:true, result:'內文含具體傷害描述，符合創傷細節定義（R3）。'},
        {id:'author', label:'查作者', result:'真實帳號。無不良紀錄。純為警世分享。'}
      ], correct:'remove', reveal:'expand',
